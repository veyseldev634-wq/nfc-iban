<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IBAN Bilgileri</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7fb;color:#14243b;margin:0;padding:24px}.card{max-width:440px;margin:40px auto;background:white;border-radius:18px;padding:26px;box-shadow:0 6px 28px #14243b12}h1{font-size:24px;margin:0 0 20px}label{display:block;font-size:13px;color:#59677b;margin:16px 0 6px}input{width:100%;box-sizing:border-box;border:1px solid #ccd4df;border-radius:9px;padding:12px;font-size:16px}button{background:#175cd3;color:white;border:0;border-radius:9px;padding:14px;width:100%;font-weight:650;font-size:15px;cursor:pointer;margin-top:20px}.value{font-size:18px;overflow-wrap:anywhere;font-weight:600}.muted{color:#667085;font-size:13px;line-height:1.5}.hidden{display:none}.error{color:#b42318}#link{overflow-wrap:anywhere;font-size:12px}hr{border:0;border-top:1px solid #e5e9f0;margin:18px 0}</style></head><body><main class="card"><section id="editor"><h1>IBAN Bağlantısı Oluştur</h1><p class="muted">Bilgiler sunucuya gönderilmez. Bağlantıyı bilen herkes bu bilgileri görebilir.</p><label for="name">Alıcı adı soyadı / ünvanı</label><input id="name" maxlength="90" autocomplete="off" placeholder="Ad Soyad"><label for="bank">Banka adı</label><input id="bank" maxlength="70" autocomplete="off" placeholder="Banka"><label for="iban">IBAN</label><input id="iban" maxlength="34" autocomplete="off" placeholder="TR00 0000 0000 0000 0000 0000 00"><button id="make">NFC Bağlantısı Oluştur</button><p id="status" class="muted" aria-live="polite"></p><div id="result" class="hidden"><hr><div id="link"></div><button id="copyLink">Bağlantıyı Kopyala</button></div></section><section id="payment" class="hidden"><h1>Banka Bilgileri</h1><label>ALICI ADI SOYADI</label><div class="value" id="payName"></div><label>BANKA ADI</label><div class="value" id="payBank"></div><label>IBAN</label><div class="value" id="payIban"></div><button id="copyIban">IBAN'ı Kopyala</button><p id="copyStatus" class="muted" aria-live="polite"></p></section></main><script>
const $=id=>document.getElementById(id);const encoder=new TextEncoder();const bytes=s=>encoder.encode(s).length;
const enc=s=>{let out='';for(const b of encoder.encode(s)){out+=String.fromCharCode(b)}return btoa(out).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const dec=s=>{let binary=atob(s.replace(/-/g,'+').replace(/_/g,'/'));return new TextDecoder().decode(Uint8Array.from(binary,c=>c.charCodeAt(0)))};
function checkIban(s){if(!/^TR\d{24}$/.test(s))return false;let rearranged=s.slice(4)+s.slice(0,4);let n='';for(const c of rearranged)n+=/[A-Z]/.test(c)?String(c.charCodeAt(0)-55):c;let rem=0;for(const c of n)rem=(rem*10+Number(c))%97;return rem===1}
function ndefSize(url){const payload=bytes(url)+1;const record=payload<=255?4+payload:7+payload;return record+3} // NDEF URI record: short URI payload + header/type/length + TLV overhead
const params=new URLSearchParams(location.search);const data=params.get('d');if(data){try{const a=JSON.parse(dec(data));if(!Array.isArray(a)||a.length!==3||!a.every(x=>typeof x==='string')||!checkIban(a[2]))throw Error();$('editor').classList.add('hidden');$('payment').classList.remove('hidden');$('payName').textContent=a[0];$('payBank').textContent=a[1];$('payIban').textContent=a[2].replace(/(.{4})/g,'$1 ').trim();$('copyIban').onclick=async()=>{try{await navigator.clipboard.writeText(a[2]);$('copyStatus').textContent='IBAN kopyalandı.'}catch{$('copyStatus').textContent='Kopyalama engellendi. IBAN üzerine basılı tutup kopyalayabilirsiniz.'}}}catch{$('status').textContent='Bağlantıdaki IBAN bilgileri geçersiz.';$('status').classList.add('error')}}
$('make').onclick=()=>{const name=$('name').value.trim(),bank=$('bank').value.trim(),iban=$('iban').value.replace(/\s/g,'').toUpperCase(),status=$('status');$('result').classList.add('hidden');status.classList.remove('error');if(!name||!bank||!checkIban(iban)){status.textContent='Lütfen tüm alanları doldurun ve geçerli bir TR IBAN girin.';status.classList.add('error');return}const url=location.origin+location.pathname+'?d='+enc(JSON.stringify([name,bank,iban]));const size=ndefSize(url);status.textContent='Tahmini NFC NDEF kayıt boyutu: '+size+' / 144 bayt. '+(size<=144?'NTAG213 için uygun görünüyor.':'NTAG213 için fazla uzun. Daha kısa bir site adresi veya farklı yöntem gerekir.');if(size>144)status.classList.add('error');$('link').textContent=url;$('result').classList.remove('hidden');$('copyLink').onclick=async()=>{try{await navigator.clipboard.writeText(url);$('copyLink').textContent='Kopyalandı'}catch{status.textContent='Bağlantıyı seçerek elle kopyalayın.'}}};
</script></body></html>
